<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 24px;
    }
    .section {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid #eee;
    }
    .section h2 {
      font-size: 14px;
      color: #888;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section p {
      margin: 0;
      line-height: 1.6;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .skill {
      background: #f0f0f0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>예연 👋</h1>


  <div class="section">
    <h2>소개</h2>
    <p>안녕하세요! 예연입니다.</p>
  </div>

  <div class="section">
    <h2>취미</h2>
    <div class="skills">
      <span class="skill">맛집탐장</span>
      <span class="skill">잠</span>
      <span class="skill">먹방</span>
      <span class="skill">산책</span>
    </div>
  </div>


  </div>
</body>
</html>
